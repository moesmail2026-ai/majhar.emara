<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجهر — منصة التعلم التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&family=Marhey:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5F2;--ink:#14313A;--card:#fff;--line:#cfe0da;--blue:#3A45B5;--green:#2F8F57;--amber:#E9A826;--bad:#C2453C;--soft:#e4efe9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F2128;--ink:#E6F1EE;--card:#17303A;--line:#2a4752;--blue:#9AA2FF;--green:#5CCB8A;--amber:#F4C25A;--bad:#FF8A80;--soft:#1d3945;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F2128;--ink:#E6F1EE;--card:#17303A;--line:#2a4752;--blue:#9AA2FF;--green:#5CCB8A;--amber:#F4C25A;--bad:#FF8A80;--soft:#1d3945;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,'Segoe UI',sans-serif;line-height:1.8;font-size:17px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:50%;border:4px solid var(--blue);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;width:5px;height:12px;background:var(--blue);bottom:-11px;inset-inline-start:11px;transform:rotate(-35deg);border-radius:3px}
.xp{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:600}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
nav button{font:inherit;font-size:13px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
:root:not([data-theme="light"]) nav button.on{color:#0F2128}
nav button.ok:after{content:" ✓";color:var(--green);font-weight:700}
nav button.on.ok:after{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:28px;line-height:1.4;margin:0 0 8px}
h2{font-size:22px;margin:0 0 8px}
p{margin:0 0 10px;max-width:60ch}
.btn{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 22px;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#0F2128}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:200px}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{font:inherit;text-align:start;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.note{padding:10px 14px;border-radius:12px;background:var(--soft);margin-top:8px}
.hint{color:var(--amber);font-weight:600}
.fig{display:flex;justify-content:center;background:var(--soft);border-radius:14px;margin-bottom:14px;padding:6px}
.fig svg{width:100%;max-height:150px}
ul.pts{padding-inline-start:20px;margin:6px 0}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{padding:6px 14px;border-radius:999px;border:1px dashed var(--line);opacity:.55}
.badge.got{opacity:1;border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 20%,var(--card))}
.track{position:relative;height:46px;background:var(--soft);border-radius:12px;margin:8px 0;overflow:hidden}
.ship{position:absolute;top:4px;font-size:28px;transition:inset-inline-start .35s linear;inset-inline-start:0;transform:scaleX(-1)}
.finish{position:absolute;inset-inline-end:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 12px)}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hd{display:flex;align-items:center;gap:10px}
.hd img{height:64px;width:auto;background:#fff;border-radius:12px;padding:4px}
.tb{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px;margin-bottom:14px}
.tb img{height:64px;width:auto;background:#fff;border-radius:12px}
.tb b{font-size:18px}.tb small{display:block;opacity:.8;line-height:1.5}
select{font:inherit;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
nav button:disabled{opacity:.4;cursor:default}
.hb{width:100%;border-collapse:collapse}.hb td{padding:10px 8px;border-bottom:1px solid var(--line)}
.hb tr.me{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.hb .rk{width:48px;font-weight:700;text-align:center}.hb .sc{text-align:end;font-weight:700;font-variant-numeric:tabular-nums}
.bdg{text-align:center;border:2px solid var(--amber);border-radius:18px;padding:14px;margin:14px 0;background:color-mix(in srgb,var(--amber) 14%,var(--card))}
.bdg img{height:130px;width:auto;background:#fff;border-radius:14px}
.bdg .bn{font-size:26px;font-weight:700;margin:8px 0 2px}
.bdg p{margin:0 auto 6px}
.fld{display:block;margin-top:14px;font-weight:600}
#nm{width:100%;margin-top:6px}
textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ico{text-align:center;font-size:20px;letter-spacing:1px;white-space:nowrap;overflow:hidden;opacity:.85;margin:-4px 0 10px;user-select:none}
button.xp{font:inherit;color:var(--ink);cursor:pointer}
body{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
.ft{position:fixed;inset-inline:0;bottom:0;z-index:40;background:linear-gradient(90deg,#1B2A6B,#2B4EA8);color:#fff;text-align:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.ft-d{font-weight:700;font-size:15px;line-height:1.5}
.ft-b{display:flex;justify-content:center;gap:12px;margin:6px 0}
.ft-a{display:flex;align-items:center;gap:8px;background:#fff;color:#1B2A6B;text-decoration:none;font-weight:600;font-size:14px;border-radius:999px;padding:6px 14px}
.ft-a svg{width:22px;height:22px}
.ft-a:focus-visible{outline:3px solid #F4C25A;outline-offset:2px}
.ft-c{font-size:12px;opacity:.9;direction:ltr}
.star{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(300deg);opacity:.2}}
.cheer{font-size:20px;font-weight:700;color:var(--green)}.cheer.bad{color:var(--bad)}
.chip{margin-inline-start:auto;background:var(--soft);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
.badge small{opacity:.8;margin-inline-start:6px}
.cn{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F4C430 55%,#B8860B);border:1.5px solid #B8860B;vertical-align:-3px;margin-inline-end:6px}
.coin{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F4C430 55%,#B8860B);border:2px solid #B8860B;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:70;pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#8A6100;font-size:15px;transition:transform .9s cubic-bezier(.25,.8,.3,1),opacity .25s}
.xp.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}
.cstack{display:inline-block;position:relative;width:26px;height:26px;vertical-align:-7px;margin-inline-end:4px}
.cstack i{position:absolute;inset-inline-start:0;width:26px;height:10px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#FFF1A8,#F2B705 70%);border:1.5px solid #9A6B00;box-shadow:0 3px 0 #B8860B}
.cstack i:nth-child(1){bottom:0}.cstack i:nth-child(2){bottom:5px}.cstack i:nth-child(3){bottom:10px}.cstack i:nth-child(4){bottom:15px}
header{flex-wrap:wrap}
.slogan{flex:1 1 220px;text-align:center;font-family:'A Massir ballpoint','A Massir','Marhey','Readex Pro',cursive;font-weight:700;font-size:24px;line-height:1.4;color:var(--blue)}
</style>
</head>

const A_CARDS=[
{t:'الخصائص العامة للحيوانات',svg:`<g stroke='#3A45B5' stroke-width='3' fill='#3A45B533'><circle cx='110' cy='75' r='26'/><circle cx='150' cy='60' r='26'/><circle cx='150' cy='98' r='26'/><circle cx='190' cy='78' r='26'/></g><g fill='#3A45B5'><circle cx='110' cy='75' r='7'/><circle cx='150' cy='60' r='7'/><circle cx='150' cy='98' r='7'/><circle cx='190' cy='78' r='7'/></g>`,
p:['الحيوانات مخلوقات حية <b>متعددة الخلايا</b>، <b>حقيقية النواة</b>، <b>غير ذاتية التغذي</b>، تكيفت للعيش في بيئات مختلفة.','النمر حيوان متعدد الخلايا، أما البراميسيوم فحقيقي النواة لكنه وحيد الخلية، فليس حيوانًا.','تفتقر الخلايا الحيوانية إلى <b>الجدار الخلوي</b> بعكس النباتات، وتنتظم خلاياها في أنسجة (إلا في الإسفنج).','تتكاثر أغلب الحيوانات جنسيًا، وأغلبها يستطيع الحركة.']},
{t:'التغذي والهضم',svg:`<circle cx='120' cy='75' r='40' fill='#E9A82633' stroke='#E9A826' stroke-width='4'/><path d='M200 75h-35' stroke='#3A45B5' stroke-width='6' stroke-linecap='round'/><path d='M172 62l-12 13 12 13' fill='none' stroke='#3A45B5' stroke-width='6' stroke-linecap='round'/>`,
p:['لأن الحيوانات غير ذاتية التغذي فلا بد أن تتغذى على <b>مخلوقات حية أخرى</b>.','يحدد <b>تركيب أجزاء الفم</b> وظيفة الفم عند الحيوان.','بعد الحصول على الغذاء يجب أن يُهضم: الإسفنج يهضم غذاءه <b>داخل خلايا خاصة</b>.','ويهضم بعضها غذاءه داخل <b>تجاويف الجسم أو أعضاء متخصصة</b>، مثل دودة الأرض والجمل.']},
{t:'الدعامة والهيكل',svg:`<rect x='70' y='50' width='70' height='50' rx='14' fill='#E9A82644' stroke='#E9A826' stroke-width='4'/><g stroke='#3A45B5' stroke-width='6' stroke-linecap='round'><path d='M190 40v70'/><path d='M190 55h-22M190 70h22M190 85h-22M190 100h22'/></g>`,
p:['<b>اللافقاريات</b> حيوانات بلا عمود فقري، ويتراوح نسبتها بين 95 و99% من أنواع الحيوان، وكثير منها له <b>هيكل خارجي</b> قاسٍ يدعم الجسم ويحميه من المفترسات وفقدان الماء.','يجب أن يتخلص الحيوان من هيكله الخارجي القديم لينمو ويكوّن هيكلًا جديدًا، كاليعسوب.','<b>الفقاريات</b> لها عمود فقري و<b>هيكل داخلي</b> ينمو مع نمو الحيوان، ويحمي الأعضاء الداخلية ويدعم العضلات.','مادة الهيكل الداخلي تختلف: كربونات الكالسيوم في نجم البحر وقنفذ البحر، وغضاريف في سمك القرش، وعظم في الأسماك العظمية والبرمائيات والزواحف والطيور والثدييات.']},
{t:'الحركة والتكاثر',svg:`<g stroke='#2F8F57' stroke-width='4' fill='#2F8F5733'><circle cx='90' cy='75' r='20'/><circle cx='150' cy='75' r='30'/><circle cx='215' cy='75' r='20'/></g><path d='M112 75h14M184 75h14' stroke='#14313A' stroke-width='4'/>`,
p:['تمكّن الأنسجة العصبية والعضلية الحيوانات من الحركة بسرعة أكبر من المخلوقات الأخرى، وبعضها جالس (sessile) في طور اكتمال النمو.','التكاثر الجنسي: يُنتج الذكر المنويات والأنثى البويضات. ومن الحيوانات <b>الخنثى</b> (مثل دودة الأرض) ما ينتج المنويات والبويضات معًا.','<b>الإخصاب الداخلي</b>: اندماج المنوي بالبويضة داخل جسم الأنثى. <b>الإخصاب الخارجي</b>: خارج الجسم في بيئة مائية.','التكاثر اللاجنسي في عدد قليل: التبرعم، والتجزؤ، والتجديد، والتكاثر العذري.']},
{t:'التكوين الجنيني المبكر',svg:`<circle cx='60' cy='75' r='20' fill='#3A45B544' stroke='#3A45B5' stroke-width='3'/><circle cx='140' cy='75' r='28' fill='none' stroke='#3A45B5' stroke-width='3' stroke-dasharray='5 4'/><path d='M165 100c20-45 35-45 55 0' fill='#E9A82644' stroke='#E9A826' stroke-width='4'/><path d='M85 75h25M165 40v-5M232 75h20' stroke='#14313A' stroke-width='4'/>`,
p:['الاندماج ينتج <b>اللاقحة (الزيجوت)</b>، فتنقسم انقسامًا متساويًا إلى خليتين، ثم تتوالى الانقسامات.','<b>البلاستيولا</b>: كرة مجوفة مملوءة بسائل من الخلايا. يزداد عدد الخلايا بينما يبقى الحجم الكلي للجنين كما هو في المراحل المبكرة.','<b>الجاسترولا</b>: تتحرك بعض خلايا البلاستيولا إلى الداخل فيتكون كيس ذو طبقتين من الخلايا وله فتحة في إحدى نهايتيه، يشبه جاسترولا فقاعة داخل أخرى.']},
{t:'نمو الأنسجة وتخصصها',svg:`<g fill='none' stroke-width='12'><circle cx='150' cy='75' r='56' stroke='#3A45B5'/><circle cx='150' cy='75' r='38' stroke='#C2453C'/><circle cx='150' cy='75' r='22' stroke='#E9A826'/></g>`,
p:['النسيج مجموعة خلايا تتخصص في وظيفة معينة، فالنسيج <b>العصبي</b> ينقل السيالات العصبية، والنسيج <b>العضلي</b> يمكّن الجسم من الحركة.','<b>الطبقة الخارجية (الإكتوديرم)</b> تكوّن الجلد والأنسجة العصبية.','<b>الطبقة الداخلية (الإندوديرم)</b> تكوّن أعضاء الهضم وبطانة القناة الهضمية.','<b>الطبقة الوسطى (الميزوديرم)</b> تكوّن النسيج العضلي وأجهزة الدوران والإخراج، وأحيانًا الجهاز التنفسي.']}
];

const B_CARDS=[
{t:'الأنسجة وعدم التناظر',svg:`<path d='M100 110c-20-40 5-70 30-55s30-35 55-15 20 55 0 70-65 20-85 0z' fill='#E9A82633' stroke='#E9A826' stroke-width='4'/>`,
p:['تُوظَّف الصفات التشريحية (مستويات بناء الجسم) في تصنيف الحيوانات، والأنسجة هي الصفة الأولى لذلك.','الإسفنجيات هي الحيوانات الوحيدة التي ليس لها أنسجة.','<b>عديم التناظر</b>: لا يوجد في جسمه انتظام أو اتزان، فشكله غير منتظم مثل الإسفنج.']},
{t:'التناظر الشعاعي والجانبي',svg:`<circle cx='90' cy='75' r='40' fill='#3A45B522' stroke='#3A45B5' stroke-width='3'/><path d='M90 35v80M50 75h80M62 47l56 56M118 47l-56 56' stroke='#3A45B5' stroke-width='2'/><ellipse cx='220' cy='75' rx='45' ry='28' fill='#2F8F5722' stroke='#2F8F57' stroke-width='3'/><path d='M220 40v70' stroke='#2F8F57' stroke-width='3' stroke-dasharray='5 4'/>`,
p:['<b>التناظر الشعاعي</b> (قنديل البحر): يُقسَّم الجسم إلى نصفين متساويين عبر أي مستوى يمر بمحوره المركزي، وتكيّف لرصد الفرائس القادمة من أي اتجاه. له طبقتان جنينيتان.','<b>التناظر الجانبي</b> (الطائر الطنان): يُقسَّم الجسم إلى نصفين متماثلين كل منهما صورة للآخر، على طول المحور المركزي من الفم حتى نهاية الجسم. له ثلاث طبقات جنينية.','<b>تميز الرأس</b>: لذوات التناظر الجانبي طرف أمامي (رأس) وخلفي، وجانبان ظهري وبطني، ويتركز فيه النسيج العصبي وأعضاء الحس.']},
{t:'تجاويف الجسم',svg:`<g fill='none' stroke-width='10'><circle cx='150' cy='75' r='52' stroke='#3A45B5'/><circle cx='150' cy='75' r='36' stroke='#C2453C'/></g><circle cx='150' cy='75' r='20' fill='#E9A826'/>`,
p:['<b>حقيقية التجويف الجسمي</b> (دودة الأرض): تجويف مملوء بسائل بين القناة الهضمية وجدار الجسم، يبطّنه نسيج من الطبقة الوسطى.','<b>كاذبة التجويف الجسمي</b> (الديدان الأسطوانية): يتكون التجويف بين الطبقتين الوسطى والداخلية، فيبطّن جزئيًا بالطبقة الوسطى.','<b>عديمة التجويف الجسمي</b> (الديدان المفلطحة): جسم مصمت بين القناة الهضمية وجدار الجسم، وتنتشر المواد من خلية لأخرى لعدم وجود جهاز دوران.','التجويف الحقيقي يمكّن الأعضاء من التخصص، فيكبر الحيوان وتزداد كفاءة أجهزته ونشاطه.']},
{t:'بدائية الفم وثانوية الفم',svg:`<circle cx='85' cy='75' r='40' fill='#3A45B522' stroke='#3A45B5' stroke-width='3'/><path d='M85 35v14' stroke='#C2453C' stroke-width='6' stroke-linecap='round'/><circle cx='215' cy='75' r='40' fill='#2F8F5722' stroke='#2F8F57' stroke-width='3'/><path d='M215 115v-14' stroke='#C2453C' stroke-width='6' stroke-linecap='round'/>`,
p:['<b>بدائية الفم</b> (القواقع ودودة الأرض والعناكب): يتكون الفم من أول فتحة في الجاسترولا (فتحة البلاستيولا). مصير كل خلية يتحدد مبكرًا، فإن أُخذت خلية في مرحلة الأربع خلايا تغيّر نمو الجنين.','<b>ثانوية الفم</b> (قنفذ البحر والكلاب والطيور): تصبح الفتحة الأولى هي الشرج، ويتكون الفم من فتحة أخرى. وكل خلية في المراحل المبكرة يمكن أن تكوّن جنينًا جديدًا.','في بدائية الفم تنشطر الطبقة الوسطى لتكوّن التجويف، وفي ثانوية الفم يتكون التجويف من جيوب (أكياس) من الطبقة الوسطى.']},
{t:'التقسيم',svg:`<g fill='#E9A82633' stroke='#E9A826' stroke-width='3'><rect x='50' y='55' width='36' height='40' rx='12'/><rect x='92' y='55' width='36' height='40' rx='12'/><rect x='134' y='55' width='36' height='40' rx='12'/><rect x='176' y='55' width='36' height='40' rx='12'/><rect x='218' y='55' width='36' height='40' rx='12'/></g>`,
p:['<b>التقسيم</b>: يتكون الجسم من قطع متشابهة ومتكررة كحلقات السلسلة، وهو دلالة على تعقد تركيب الجسم. مثال: العقرب.','الفائدة الأولى: يستطيع الحيوان المقسّم العيش عند تلف إحدى قطعه، لأن بعض القطع يمكن أن ينجز أعمال الجزء التالف.','الفائدة الثانية: تكون الحركة أكثر كفاءة، لأن القطع يمكن أن تتحرك مستقلة بعضها عن بعض، كتحريك العقرب ذيله في اتجاهات مختلفة.']}
];

{t:'تركيب الإسفنج وتغذيته الترشيحية',e:'🧽',p:['الإسفنجيات أول شعب المملكة الحيوانية، <b>لا أنسجة ولا أعضاء</b> لها، وهي جالسة وتعيش معظمها في البحار.','جسمها طبقتان من الخلايا المستقلة بينهما طبقة هلامية: الخارجية خلايا شبه طلائية تحميها، والداخلية <b>خلايا مطوقة</b> بأسواط تحرك الماء عبر الثقوب ليخرج من الفتحة الزفيرية.','<b>تغذٍّ ترشيحي</b>: ترشح الدقائق الصغيرة من الماء، وإسفنجة طولها 10 cm ترشح نحو 100 L يوميًا، وتهضم الخلية الغذاء الملتصق بها داخلها.','الخلايا شبه الأميبية (الأركيوسايت) تشارك في الهضم والتكاثر والإخراج، وتنتج الشويكات للدعامة.']},
{t:'الخلايا اللاسعة واقتناص الفريسة',e:'🌊',p:['اللاسعات (الجوفمعويات) لها <b>تناظر شعاعي</b> وجسم من طبقتين وفتحة واحدة (فم) ولوامس.','تحتوي اللوامس على <b>الخلايا اللاسعة</b>، في كل منها <b>كيس خيطي لاسع</b> فيه أنبوب ملتف كالخيط يحمل سمًّا وخطاطيف.','عند اللمس أو المنبه الكيميائي تزداد نفاذية غشاء الكيس فيندفع الماء إلى داخله فينطلق الخيط ويخترق الفريسة.','تجلب اللوامس الفريسة إلى الفم، وتهضمها إنزيمات التجويف المعوي الوعائي، وتخرج الفضلات من الفم.']},
{t:'التكاثر والاستجابة: مقارنة',e:'⚖️',p:['<b>الإسفنج</b>: خنثى غالبًا، تكاثر جنسي (منويات تسبح في الماء وبويضة تخصب داخليًا ثم يرقة مهدبة)، ولاجنسي بالتجزؤ أو التبرعم أو البريعمات.','<b>اللاسعات</b>: الجنس منفصل وتتكاثر جنسيًا، والطور البوليبي يتكاثر لاجنسيًا بالتبرعم، والطور الميدوزي جنسيًا بتكوين الزايجوت.','الاستجابة في الإسفنج: لا جهاز عصبي، وخلاياه تستجيب للمس والمنبهات الكيميائية بإغلاق الثقوب لإيقاف تيار الماء.','في اللاسعات <b>شبكة عصبية</b> بسيطة توصل السيالات فتنقبض الخلايا شبه العضلية وتتحرك اللوامس.']},
{t:'الشعاب المرجانية وأهميتها',e:'🪸',p:['يفرز المرجان كربونات الكالسيوم حول جسمه الطري، وتتكون الشعاب من هذه الأغطية عبر آلاف السنين.','يعيش مع المرجان طلائعيات تسمى زوكزانثيلي في معيشة <b>تكافلية</b>: تنتج الأكسجين والغذاء وتكسبه ألوانه الزاهية.','<b>أهمية بيئية</b>: موطن للأسماك وكائنات كثيرة. <b>أهمية اقتصادية</b>: سياحة، ومركب هيدروكسي أباتيت يستخدم في زراعة عظام الفك والوجه.','تعتمد صحتها على حرارة الماء وضوء كافٍ وعمق مناسب، وعند اختلالها تتعرض للاستنزاف (التبييض).']}

function badgeHtml(){const p=lessonPts(),b=curBadge();return `<div class="bdg"><img src="${TEACHER2}" alt="أ. محمد عمارة"><div class="bn">${b.i} ${b.n}</div><p>لقد منحتك شارة «${b.n}» بحسب مجموع نقاطك في هذا الدرس (${p} نقطة).</p><small>أ. محمد عمارة</small></div>`}
function wipe(keepName){S.xp=0;S.done={};S.prog={};S.pts={};S.lesson='';CARDS=[];PRACTICE=[];QUIZ=[];if(!keepName)S.name=''}
const NEED={practice:'learn',quiz:'practice',race:'quiz'};
const okTo=k=>k==='home'||(k==='honor'?OWNER:(!!S.name&&!!S.lesson&&(!NEED[k]||!!S.done[NEED[k]])));
function navDraw(){const t=TABS.filter(([k])=>k!=='honor'||OWNER);$('#nav').style.gridTemplateColumns='repeat('+(t.length||1)+',1fr)';$('#nav').innerHTML=t.map(([k,l])=>`<button class="${view===k?'on':''} ${S.done[k]?'ok':''}" ${okTo(k)?'':'disabled'} onclick="go('${k}')">${l}</button>`).join('')}
let DB=null,UID=null,OWNER=false,ST='',unsub=null;
const stat=()=>ST==='ok'?'تم حفظ نتيجتك في لوحة الشرف.':ST==='fail'?'تعذر حفظ نتيجتك في لوحة الشرف. تأكد من تسجيل الدخول بحسابك، أو أرسل رمز النتيجة لمعلمك.':ST==='off'?'لوحة الشرف المشتركة غير متاحة لك الآن. أرسل رمز نتيجتك لمعلمك من تبويب لوحة الشرف.':'';
async function curRound(){try{const s=await DB.doc('config/round').get();return s.exists?(s.data().n||0):0}catch(e){return null}}
async function syncRound(){const c=await curRound();if(c===null)return null;if(S.round===undefined){S.round=c;save()}else if(S.round!==c){S.round=c;wipe(false);save();$('#xp').textContent=0;if(view!=='honor'){view='home';render()}}return c}
(async()=>{try{if(typeof claude==='undefined'){ST='off';return}const u=await claude.use('user'),d=await claude.use('db');if(u&&d){UID=await u.id();DB=d;OWNER=await u.isOwner();await syncRound();if(FRESH){try{await DB.doc('honor/'+UID).delete()}catch(e){}}sync();if(view==='honor')honor();else if(view==='home')render();else navDraw()}}catch(e){ST='off'}})();
async function sync(){if(!DB||!UID||OWNER)return;try{const c=await syncRound();if(c===null||!S.name)return;await DB.doc('honor/'+UID).set({name:S.name,xp:S.xp,r:c,t:Date.now()});ST='ok'}catch(e){ST='fail'}}
async function newRound(){const c=(await curRound())||0;await DB.doc('config/round').set({n:c+1,t:Date.now()});try{const q=await DB.collection('honor').get();await Promise.all(q.docs.map(d=>DB.doc('honor/'+d.id).delete()))}catch(e){}S.round=c+1;wipe(false);save();$('#xp').textContent=0;honor()}
function askRestart(){$('#rsx').innerHTML='<div class="note">ستُمسح نقاطك وتقدمك في كل الدروس، وتبدأ من جديد. هل أنت متأكد؟</div><div class="row" style="margin-top:10px"><button class="btn" onclick="restart()">نعم، امسح نتائجي</button><button class="btn ghost" onclick="render()">إلغاء</button></div>'}
async function restart(){wipe(true);save();$('#xp').textContent=0;ST='';if(DB&&UID){try{await DB.doc('honor/'+UID).delete()}catch(e){}}view='home';render()}
const chk=(n,x)=>{let h=7;for(const c of n+'|'+x+'|mj')h=(h*31+c.charCodeAt(0))%1000003;return h.toString(36)};
const myCode=()=>{try{return 'MJ1-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,x:S.xp,c:chk(S.name,S.xp)}))))}catch(e){return''}};
function codeHtml(){if(!S.name)return'';return `<div class="note"><b>رمز نتيجتك للمعلم</b><br><span dir="ltr" id="cd" style="word-break:break-all;user-select:all">${myCode()}</span><div class="row" style="margin-top:8px"><button class="btn ghost" onclick="copyCode()">نسخ الرمز</button></div><small>أرسل هذا الرمز إلى معلمك ليُضاف اسمك ونقاطك إلى لوحة الشرف.</small></div>`}
function copyCode(){const sel=()=>{const r=document.createRange();r.selectNodeContents($('#cd'));const g=getSelection();g.removeAllRanges();g.addRange(r)};try{navigator.clipboard.writeText(myCode()).then(()=>$('#cd').insertAdjacentText('afterend',' ✓ تم النسخ'),sel)}catch(e){sel()}}
function parseCode(t){try{if(!t.startsWith('MJ1-'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));return(o.n&&typeof o.x==='number'&&o.c===chk(o.n,o.x))?o:null}catch(e){return null}}
async function addCodes(){const el=$('#cin'),msg=$('#cm');if(!DB){msg.textContent='الحفظ غير متاح الآن.';return}
  const cur=(await curRound())||0;let ok=0,bad=0;
  for(const l of el.value.split(/\s+/).filter(Boolean)){const o=parseCode(l);if(!o){bad++;continue}
    const id='m'+[...String(o.n)].map(c=>c.charCodeAt(0).toString(36)).join('').slice(0,100);
    try{await DB.doc('honor/'+id).set({name:String(o.n).slice(0,40),xp:o.x,r:cur,t:Date.now()});ok++}catch(e){bad++}}
  el.value='';msg.textContent=ok?`أُضيفت ${ok} نتيجة`+(bad?`، وتعذّر ${bad} رمز.`:'.'):(bad?'الرمز غير صالح.':'الصق رمزًا أولًا.')}
async function delRow(id){try{await DB.doc('honor/'+id).delete()}catch(e){}}
function honor(){
  if(unsub){unsub();unsub=null}
  if(!OWNER){view='home';return render()}
  $('#app').innerHTML='<div class="card"><h2>لوحة الشرف</h2><p id="hm">جارٍ تحميل الترتيب…</p><div id="ht"></div></div><div class="card"><h2>إضافة نتائج الطلاب</h2><p>الصق رمز نتيجة كل طالب (يمكن لصق عدة رموز، كل رمز في سطر).</p><textarea id="cin" rows="3" dir="ltr" aria-label="رموز النتائج"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="cb">إضافة النتائج</button></div><p id="cm" class="hint"></p></div><div class="card" id="rs"></div>';
  const m=['🥇','🥈','🥉'];let rows=[];
  const draw=()=>{if(view!=='honor'||!$('#ht'))return;
    const best={};rows.forEach(r=>{const k=r.name||'';if(!best[k]||r.xp>best[k].xp)best[k]=r});
    const R=Object.values(best).sort((a,b)=>b.xp-a.xp||(a.t||0)-(b.t||0));
    $('#hm').textContent='ترتيب الطلاب المشاركين، من الأعلى نقاطًا إلى الأقل، وهو ظاهر لك وحدك. عدد المشاركين: '+R.length;
    $('#ht').innerHTML=R.length?'<table class="hb">'+R.map((r,i)=>`<tr><td class="rk">${m[i]||i+1}</td><td>${esc(r.name||'طالب')}</td><td class="sc">${r.xp}</td><td><button class="btn ghost" style="padding:2px 10px" onclick="delRow('${esc(r.id)}')">حذف</button></td></tr>`).join('')+'</table>':'<p>لا توجد نتائج بعد. الصق رموز نتائج الطلاب في الخانة أدناه، أو تصل نتائج من يفتح الصفحة بحساب مسجّل الدخول بصلاحية «مساهم».</p>'};
  $('#cb').onclick=addCodes;
  (async()=>{
    if(!DB){$('#hm').textContent='اللوحة المشتركة غير متاحة الآن.';return}
    const cur=(await curRound())||0;
    try{unsub=DB.collection('honor').orderBy('xp','desc').limit(200).onSnapshot(sn=>{rows=sn.docs.map(d=>({id:d.id,...d.data()})).filter(r=>(r.r||0)===cur&&r.id!==UID);draw()},()=>{if($('#hm'))$('#hm').textContent='تعذر تحميل اللوحة.'})}catch(e){}
    draw();
    $('#rs').innerHTML='<button class="btn ghost" id="rb">بدء جولة جديدة (مسح الأسماء والنقاط)</button>';
    $('#rb').onclick=()=>{$('#rs').innerHTML='<div class="note">سيُمسح ترتيب الجميع بأسمائهم ونقاطهم، ويبدأ كل طالب من جديد باختيار الدرس وكتابة اسمه. هل أنت متأكد؟</div><div class="row" style="margin-top:10px"><button class="btn" id="ry">نعم، امسح وابدأ</button><button class="btn ghost" id="rn">إلغاء</button></div>';$('#rn').onclick=honor;$('#ry').onclick=newRound};
  })();
}
function go(v){if(!okTo(v))return;clearInterval(timer);if(unsub&&v!=='honor'){unsub();unsub=null}view=v;render()}

function render(){
  if(!okTo(view))view='home';
  theme();$('#snd').textContent=S.mute?'🔇':'🔊';
  $('#xp').textContent=animXP!==null?animXP:S.xp;
  navDraw();
  ({home,honor,learn:()=>learn(0),practice:()=>runner(PRACTICE,'practice',PRACTICE.length),quiz:()=>runner(shuffle(QUIZ).slice(0,6),'quiz',6),race})[view]();
  window.scrollTo(0,0);$('#tb').innerHTML=['learn','practice','quiz','race'].includes(view)?tb():'';$('#lg').src=LOGO;
}

function startSetup(){
  const nm=$('#nm').value.trim(),ls=$('#ls2').value,msg=$('#sm');
  if(!nm){$('#nm').style.borderColor='var(--bad)';$('#nm').focus();msg.textContent='اكتب اسمك أولًا.';return}
  if(!ls){$('#ls2').focus();msg.textContent='اختر الدرس.';return}
  S.name=nm;save();setLesson(ls);save();sync();
  go(['learn','practice','quiz','race'].find(k=>!S.done[k])||'race');
}
function changeLesson(){save();S.lesson='';S.done={};save();render()}
const lessonOptions=()=>{const gs={};Object.keys(LESSONS).forEach(k=>{const L=LESSONS[k];(gs[L.g]=gs[L.g]||[]).push(k)});return Object.keys(gs).map(g=>`<optgroup label="${g}">${gs[g].map(k=>`<option value="${k}">${LESSONS[k].i} ${LESSONS[k].k?LESSONS[k].k+' — ':''}${LESSONS[k].n}</option>`).join('')}</optgroup>`).join('')};
const progCard=()=>{const n=Object.keys(S.done).filter(k=>S.done[k]).length,cb=S.lesson&&S.done.race?curBadge().n:'';return `<div class="card"><h2>تقدمك: ${n} من 4</h2><div class="bar"><b style="width:${n*25}%"></b></div><p style="margin-top:12px">الشارات التي يمكنك الحصول عليها في نهاية السباق${S.lesson?'':' (بحسب نقاط الدرس)'}:</p><div class="badges">${bandInfo().map(b=>`<span class="badge ${cb===b.n?'got':''}">${b.i} ${b.n}<small>${b.a===b.b?b.a:b.a+'–'+b.b}</small></span>`).join('')}</div></div>`};
function home(){
  if(!(S.name&&S.lesson)){
    $('#app').innerHTML=`<div class="card"><h1>مرحبًا بك في مجهر، لنتعلم بالتجربة</h1>
    <p>اكتب اسمك واختر الدرس، ثم اضغط «ابدأ». لن تنتقل إلى أي مهمة قبل إكمال الخطوتين.</p>
    <label class="fld" for="nm">اسمك</label><input id="nm" value="${esc(S.name||'')}" placeholder="اكتب اسمك" onkeydown="if(event.keyCode==13)startSetup()">
    <label class="fld" for="ls2">الدرس</label><select id="ls2"><option value="">— اختر الدرس —</option>${lessonOptions()}</select>
    <p id="sm" class="hint" style="margin-top:10px"></p><div class="row"><button class="btn" onclick="startSetup()">ابدأ</button></div></div>`+progCard();
    return;
  }
  const n=Object.keys(S.done).filter(k=>S.done[k]).length,nxt=['learn','practice','quiz','race'].find(k=>!S.done[k])||'race';
  $('#app').innerHTML=`<div class="card"><h1>أهلًا ${esc(S.name)}، لنتعلم بالتجربة</h1>
  <p>الدرس الحالي: <b>${LESSONS[S.lesson].i} ${LESSONS[S.lesson].n}</b> — الأحياء، الصف الأول الثانوي. شرح قصير، ثم تدريب، ثم اختبار، ثم سباق ضد مركبة منافسة. أكمل كل مهمة لتفتح التي بعدها.</p>
  <div class="row"><button class="btn" onclick="go('${nxt}')">${n?'تابع من حيث توقفت':'ابدأ الدرس'}</button><button class="btn ghost" onclick="changeLesson()">تغيير الدرس</button></div>
  <div id="rsx" class="row" style="margin-top:12px"><button class="btn ghost" onclick="askRestart()">ابدأ من جديد (مسح نتائجي)</button></div></div>`+progCard()+(S.xp>0?'<div class="card">'+codeHtml()+'</div>':'');
}
function learn(i){
  const c=CARDS[i],last=i===CARDS.length-1;
  $('#app').innerHTML=`<div class="card"><div class="bar" style="margin-bottom:14px"><b style="width:${(i+1)/CARDS.length*100}%"></b></div>
  <div class="fig">${c.svg?`<svg viewBox="0 0 300 150" role="img" aria-label="${c.t}">${c.svg}</svg>`:`<span style="font-size:72px;line-height:1.3" role="img" aria-label="${c.t}">${c.e}</span>`}</div>
  <h2>${c.t}</h2>${c.p.map(x=>`<p>${x}</p>`).join('')}
  <div class="row"><button class="btn ghost" ${i?'':'disabled'} onclick="learn(${i-1})">السابق</button>
  <button class="btn" onclick="${last?'finishLearn()':'learn('+(i+1)+')'}">${last?'أنهيت الدرس':'التالي'}</button></div></div>`;
}
function finishLearn(){S.done.learn=true;addXP(20,'learn');go('practice')}

function runner(bank,mode,total){
  let i=0,score=0,first=true,locked=false;
  const show=()=>{
    const it=bank[i];{const c0=it.o[it.a];it.o=shuffle(it.o);it.a=it.o.indexOf(c0)}first=true;locked=false;
    $('#app').innerHTML=`<div class="card"><div class="bar" style="margin-bottom:14px"><b style="width:${i/total*100}%"></b></div>
    <p>السؤال ${i+1} من ${total}</p><h2>${it.q}</h2><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,+b.dataset.k));
  };
  const pick=(b,k)=>{
    if(locked)return;const it=bank[i];
    if(k===it.a){locked=true;b.classList.add('right');if(first)score++;fx(true);
      $('#fb').innerHTML=`<div class="note"><b class="cheer">${cheer(true)}</b> ${it.e||''}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${i+1<total?'التالي':'النتيجة'}</button></div>`;
      $('#nx').onclick=()=>{i++;i<total?show():end()};$('#nx').focus();
    }else{
      b.classList.add('wrong');b.disabled=true;fx(false);
      if(mode==='practice'){first=false;$('#fb').innerHTML=`<div class="note"><b class="cheer bad">${cheer(false)}</b> <span class="hint">تلميح:</span> ${it.h}</div>`}
      else{locked=true;document.querySelectorAll('.opt')[it.a].classList.add('right');
        $('#fb').innerHTML=`<div class="note"><b class="cheer bad">${cheer(false)}</b> الإجابة الصحيحة موضحة بالأخضر. ${it.e}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${i+1<total?'التالي':'النتيجة'}</button></div>`;
        $('#nx').onclick=()=>{i++;i<total?show():end()};$('#nx').focus()}
    }
  };
  const end=()=>{
    const pass=score/total>=0.6,gain=score*5+(pass?15:0);
    if(pass)S.done[mode]=true;addXP(gain,mode);
    const next=mode==='practice'?'quiz':'race';
    $('#app').innerHTML=`<div class="card"><h1>${score} من ${total}</h1>
    <p>${pass?'أحسنت، حصلت على '+gain+' نقطة. تُحتسب أعلى نتيجة لك في كل مهمة.':'اقتربت. راجع الدرس ثم أعد المحاولة، فالتكرار يثبّت المعلومة.'}</p>
    <div class="row"><button class="btn ghost" onclick="go('${mode}')">أعد المحاولة</button>
    <button class="btn ghost" onclick="go('learn')">راجع الدرس</button>
    ${pass?`<button class="btn" onclick="go('${next}')">${mode==='practice'?'إلى الاختبار':'إلى السباق'}</button>`:''}</div></div>`;
  };
  show();
}

let timer;
function race(){
  const bank=shuffle(QUIZ.concat(PRACTICE.map(p=>({...p,e:p.h}))));
  let i=0,me=0,rival=0,left=80,over=false;
  $('#app').innerHTML=`<div class="card"><h2>سباق المركبات</h2><p>أجب بسرعة لتتقدم مركبتك 🚀 قبل أن تصل المنافِسة 🛸 إلى خط النهاية. الوقت: <span class="timer" id="tm">80</span> ثانية.</p>
  <div class="track"><span class="ship" id="me">🚀</span><span class="finish"></span></div>
  <div class="track"><span class="ship" id="rv">🛸</span><span class="finish"></span></div>
  <div id="ch" class="cheer" aria-live="polite" style="min-height:30px"></div><div id="qa"></div></div>`;
  const q=()=>{const it=bank[i%bank.length];{const c0=it.o[it.a];it.o=shuffle(it.o);it.a=it.o.indexOf(c0)}
    $('#qa').innerHTML=`<h2>${it.q}</h2><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(over)return;
      if(+b.dataset.k===it.a){me=Math.min(100,me+10);fx(true,1)}else{b.classList.add('wrong');rival=Math.min(100,rival+4);fx(false)}
      i++;draw();if(me>=100)finish(true);else setTimeout(()=>!over&&q(),b.classList.contains('wrong')?350:0)})};
  const draw=()=>{$('#me').style.insetInlineStart=`calc(${me}% - ${me*0.4}px)`;$('#rv').style.insetInlineStart=`calc(${rival}% - ${rival*0.4}px)`;$('#tm').textContent=left};
  const finish=w=>{over=true;clearInterval(timer);
    const gain=w?50:15;if(w)S.done.race=true;addXP(gain,'race');
    $('#app').innerHTML=`<div class="card"><h1>${w?'فزت بالسباق':'سبقتك المنافِسة هذه المرة'}</h1>
    <p>حصلت على ${gain} نقطة. ${w?'أتقنت درس '+LESSONS[S.lesson].n+'.':'جرّب مرة أخرى بعد مراجعة الدرس.'}</p>${badgeHtml()}${codeHtml()}
    <div class="row"><button class="btn" onclick="go('race')">سباق جديد</button><button class="btn ghost" onclick="go('home')">الرئيسية</button></div></div>`};
  timer=setInterval(()=>{left-=0.2;rival=Math.min(100,rival+100/(80*5)*1.0);draw();
    $('#tm').textContent=Math.max(0,Math.ceil(left));
    if(rival>=100||left<=0)finish(false)},200);
  q();draw();
}
render();
</script>
</body>
</html>
